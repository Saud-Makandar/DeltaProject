<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="https://www.google.com/search">
        <label for="search">GSearch</label>
        <input type="text" id="search" placeholder="Search"name="q">
        <button>Search</button>
    </form>
    <form action="https://www.youtube.com/results">
        <label for="Tsearch">YTSearch</label>
        <input type="text" id="Tsearch" placeholder="Search"name="search_query">
        <button>Search</button>
    </form>
    <form action ="/action">
        <label for="apple">apple</label>
        <input type="radio" name="fruits" id="apple" value="apple">
        <label for="mango">mango</label>
        <input type="radio" name="fruits" id="mango" value="mango">
        <label for="Kiwi">Kiwi</label>
        <input type="radio" name="fruits" id="Kiwi" value="Kiwi">
        <button>Submit</button>
        <div>
            <select name="profession" id="profession"><!--Data is sent in name and value pair-->
                <option value="Developer">Dev</option>
                <option value="Ai Engineer">AI Engineer</option>
                <option value="ML ops Engineer">ML Ops Engineer</option>
            </select>
        </div>
    </form>
</body>
</html>
