<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">
        <h2>Simon Says Game</h2>
        <p>Press any Key on the Keyword !</p>
    </div>
    <div class="main">     
    <div id="row1">
        <div class="box salmon" id="salmon">salmon</div>
        <div class="box green" id="green">green</div>
    </div>
    <div id="row2">
        <div class="box cyan" id="cyan">cyan</div>
        <div class="box yellow" id="yellow">yellow</div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
