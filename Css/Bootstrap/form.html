<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <div class="container">
            <form >
                <div class="mb-3">
                     <label class="form-label" for="email">Email</label>
                <input type="text"placeholder="Email"class="form-control" id="email"></div>
                <div class="mb-3"><label class="form-label" for="Password">Password</label>
                <input type="text"placeholder="Password"class="form-control" id="Password"></div>
                <div class="mb-3"><label class="form-label" for="addr">Address</label>
                <input type="text"placeholder="addr"class="form-control-lg" id="addr"></div>
                <select class="form-select">
                    <option selected>Select Something</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">
                     Default checkbox
                    </label>
                </div>
            </form>
        </div>
</body>
</html>
