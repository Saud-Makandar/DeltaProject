<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Welcome to SimonSays game</h1>
    <h5>press any key</h5>
        
    <div id="main">

        <div id="row1">
            <div class="red box" type="button" id="red"></div>
            <div class="green box" type="button" id="green"></div>
        </div>
        <div id="row2">
            <div class="box pink" type="button" id="pink"></div>
            <div class="box purple" type="button" id="purple"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
